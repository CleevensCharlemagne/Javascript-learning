<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      function decompte(valeur) {
        const t = setInterval(() => {
          console.log(valeur);
          valeur--;

          if (valeur === -1) {
            clearInterval(t);
          }
        }, 1000);
      }

      decompte(3);
    </script>
  </body>
</html>
