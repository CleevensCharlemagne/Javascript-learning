<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      count = 5;
      const t = setInterval(() => {
        console.log(`Hi guys!!!`);
        count--;

        if (count === 0) {
          clearInterval(t);
        }
      }, 1000);
    </script>
  </body>
</html>
